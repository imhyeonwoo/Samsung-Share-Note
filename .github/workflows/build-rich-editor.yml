name: Build and browser-test Folio editor

on:
  push:
    branches: [main]
    paths:
      - 'rich-editor.src.js'
      - 'package.json'
      - 'tests/editor-smoke.html'
      - 'tests/editor-smoke.mjs'
      - '.github/workflows/build-rich-editor.yml'
  workflow_dispatch:

concurrency:
  group: folio-editor-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Build unified runtime
        run: npm run build:editor
      - name: Commit compiled bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rich-editor.bundle.js
          if git diff --cached --quiet; then
            echo "Editor bundle unchanged"
          else
            git commit -m "Build tested Folio editor as one self-contained ProseMirror module"
            git push origin HEAD:main
          fi
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Test editor initialization and page interaction
        id: smoke
        run: npm run test:editor 2>&1 | tee /tmp/folio-editor-smoke.log
      - name: Save smoke result for verification
        if: always()
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          GIT_SOURCE_SHA: ${{ github.sha }}
        run: |
          node -e 'const fs=require("fs");fs.writeFileSync("editor-ci-result.json",JSON.stringify({outcome:process.env.SMOKE_OUTCOME,source:process.env.GIT_SOURCE_SHA,checkedAt:new Date().toISOString()},null,2)+"\\n")'
          if [ -f /tmp/folio-editor-smoke.log ]; then
            tail -n 80 /tmp/folio-editor-smoke.log > editor-ci-log.txt
          else
            echo "No browser-test log (prior step may have failed)." > editor-ci-log.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor-ci-result.json editor-ci-log.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Folio browser smoke result"
            git push origin HEAD:main
          fi
