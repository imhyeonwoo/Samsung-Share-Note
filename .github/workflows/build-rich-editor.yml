name: Build and browser-test Folio editor

on:
  push:
    branches: [main]
    paths:
      - 'rich-editor.src.js'
      - 'package.json'
      - 'tests/editor-smoke.html'
      - 'tests/editor-smoke.mjs'
      - '.github/workflows/build-rich-editor.yml'
  workflow_dispatch:

concurrency:
  group: folio-editor-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        id: install
        run: npm install --no-audit --no-fund 2>&1 | tee /tmp/folio-install.log
      - name: Build unified runtime
        id: bundle
        run: npm run build:editor 2>&1 | tee /tmp/folio-build.log
      - name: Commit compiled bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rich-editor.bundle.js
          if git diff --cached --quiet; then
            echo "Editor bundle unchanged"
          else
            git commit -m "Build tested Folio editor as one self-contained ProseMirror module"
            git push origin HEAD:main
          fi
      - name: Install headless Chromium
        id: browser
        run: npx playwright install --with-deps chromium 2>&1 | tee /tmp/folio-browser.log
      - name: Test editor initialization and page interaction
        id: smoke
        run: npm run test:editor 2>&1 | tee /tmp/folio-editor-smoke.log
      - name: Save smoke result for verification
        if: always()
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BUNDLE_OUTCOME: ${{ steps.bundle.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          GIT_SOURCE_SHA: ${{ github.sha }}
        run: |
          node -e 'const fs=require("fs");fs.writeFileSync("editor-ci-result.json",JSON.stringify({install:process.env.INSTALL_OUTCOME,bundle:process.env.BUNDLE_OUTCOME,browser:process.env.BROWSER_OUTCOME,smoke:process.env.SMOKE_OUTCOME,source:process.env.GIT_SOURCE_SHA,checkedAt:new Date().toISOString()},null,2)+"\\n")'
          : > editor-ci-log.txt
          for part in install build browser editor-smoke; do
            echo "== $part ==" >> editor-ci-log.txt
            if [ -f "/tmp/folio-$part.log" ]; then
              tail -n 40 "/tmp/folio-$part.log" >> editor-ci-log.txt
            else
              echo "This step did not run." >> editor-ci-log.txt
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor-ci-result.json editor-ci-log.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Folio browser smoke result"
            git push origin HEAD:main
          fi
